<app-toast />
<app-dialog />

@if (isLoginPage()) {
  <router-outlet />
} @else {
  <header class="nav">
    <div class="navIn">
      <a routerLink="/" class="brand"><span class="mk" aria-hidden="true"><i class="r"></i><i class="b"></i><i class="t1"></i><i class="t2"></i><i class="c"></i></span>FocusPT</a>
      <a class="navItem" routerLink="/" routerLinkActive="navOn" [routerLinkActiveOptions]="{ exact: true }">Início</a>
      <a class="navItem" routerLink="/alunos" routerLinkActive="navOn">Alunos</a>
      <a class="navItem" routerLink="/agenda" routerLinkActive="navOn">Agenda</a>

      <div class="navEnd">
        <span class="k navName">{{ trainerName() }}</span>
        <div class="navMenu">
          <button type="button" class="navItem" [class.navOn]="menuOpen()" (click)="toggleMenu()"
                  aria-haspopup="true" [attr.aria-expanded]="menuOpen()" aria-controls="conta-menu">Conta</button>
          @if (menuOpen()) {
            <div id="conta-menu" class="panel pop" role="group" aria-label="Conta">
              <div class="k navName popName">{{ trainerName() }}</div>
              <span class="lb">Tema</span>
              <div class="seg" role="radiogroup" aria-label="Tema">
                @for (m of themeModes; track m) {
                  <button type="button" role="radio" [class.on]="theme.mode() === m"
                          [attr.aria-checked]="theme.mode() === m" (click)="theme.set(m)">{{ themeLabel(m) }}</button>
                }
              </div>
              <button type="button" class="btn" (click)="handleLogout()">Sair</button>
            </div>
          }
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <router-outlet />
  </main>
}
